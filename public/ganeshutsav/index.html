<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Served from public/ at /ganeshutsav (see the rewrite in next.config.mjs).
     Next strips trailing slashes, so relative asset URLs would resolve against /
     and 404. This base fixes style.css, app.js and the fetch() calls in app.js
     without editing any paths. Injected by sync-to-site.sh, do not remove. -->
<base href="/ganeshutsav/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2540a">
<title>Pune Ganpati Yatra</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="search-wrap">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 17 17"/></svg>
    <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
  </div>
  <button id="lang-btn" class="lang-btn" aria-label="Language">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 3.4 2.6 14.6 0 18"/><path d="M12 3c-2.6 3.4-2.6 14.6 0 18"/></svg>
    <span id="lang-code">EN</span>
  </button>
</div>

<button id="sos-btn" class="sos-btn" aria-label="Emergency help">SOS</button>

<button id="locate-btn" class="locate-btn" aria-label="My location">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
</button>

<section id="sheet" class="sheet">
  <button id="sheet-handle" class="sheet-handle" aria-label="Expand list">
    <span class="grabber"></span>
  </button>

  <div class="sheet-body">
    <div id="view-list">
      <p class="brand" data-i18n="appName">Pune Ganpati Yatra</p>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="routes" data-i18n="tabRoutes">Darshan Routes</button>
        <button class="tab" data-tab="all" data-i18n="tabAll">All Mandals</button>
        <button class="tab" data-tab="parking" data-i18n="tabParking">Parking</button>
      </div>
      <div id="list"></div>
    </div>

    <div id="view-detail" hidden>
      <button id="back-btn" class="back-btn">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19 8 12l7-7"/></svg>
        <span data-i18n="back">Back</span>
      </button>
      <h2 id="detail-title" class="detail-title"></h2>
      <p id="detail-sub" class="detail-sub"></p>
      <p id="detail-stats" class="detail-stats"></p>
      <p id="detail-note" class="detail-note" data-i18n="crowdNote"></p>
      <ol id="detail-stops" class="stops"></ol>
      <div class="actions">
        <button id="start-btn" class="btn btn-secondary" data-i18n="startFromLocation"></button>
        <a id="gmaps-btn" class="btn btn-primary" target="_blank" rel="noopener" data-i18n="navigateGoogle"></a>
      </div>
    </div>
  </div>
</section>

<div id="lang-gate" class="lang-gate" hidden>
  <div class="lang-card">
    <p class="lang-title">पुणे गणपती यात्रा</p>
    <p class="lang-sub">भाषा निवडा &middot; भाषा चुनें &middot; Choose your language</p>
    <button class="lang-choice" data-lang="mr">मराठी</button>
    <button class="lang-choice" data-lang="hi">हिंदी</button>
    <button class="lang-choice" data-lang="en">English</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
